name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: autoapply_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          backend/.venv
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Lint with ruff
      run: |
        cd backend
        ruff check app/ tests/
      continue-on-error: true
    
    - name: Format check with black
      run: |
        cd backend
        black --check app/ tests/ --line-length=100
      continue-on-error: true
    
    - name: Run pytest
      run: |
        cd backend
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/autoapply_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-min-32-characters
        ALGORITHM: HS256
        ACCESS_TOKEN_EXPIRE_MINUTES: 60
        LLM_PROVIDER: openai
        LLM_API_KEY: sk-test
        LLM_MODEL: gpt-4
        LLM_TEMPERATURE: "0.7"
        LOG_LEVEL: INFO
        STORAGE_PATH: ./storage
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        cd backend
        docker build -t autoapply-api:latest .
    
    - name: Run docker image
      run: |
        docker run --rm autoapply-api:latest python -c "from app.main import app; print('Build successful')"
